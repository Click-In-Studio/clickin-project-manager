name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4.2.2

      # ── 2. Setup Node ────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      # ── 3. Install & Build ───────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      - name: Build (standalone)
        run: npm run build
        env:
          # Suppress build-time DB connections; env vars come from .env.local at runtime
          SKIP_ENV_VALIDATION: '1'

      # agent-runner（#367）不是 next 的一部分：esbuild 把 agent-runner/index.ts + lib/ +
      # vendor/ + 全部 npm 依赖（含 @openclaw/ai）打成单文件放进 standalone 目录，随 bundle
      # 一起发。只有 pg 留 external（next 的 standalone 追踪会带上完整的 pg）；
      # @opentelemetry/api / bufferutil / utf-8-validate 是 provider SDK / ws 的可选依赖，
      # 不装也能跑（本机在只有 pg 的隔离目录里验证过）。
      # 教训（PR #371 首发）：不能只看 node_modules/<pkg> 目录存在——standalone 只拷 next
      # 自己用到的文件，@openclaw/ai 的 package.json / 子路径都没有，runner 起不来。
      - name: Bundle agent-runner
        run: |
          npm run build:runner
          test -f .next/standalone/node_modules/pg/package.json || { echo "::error::pg not traced into standalone"; exit 1; }
          OPTIONAL="@opentelemetry/api bufferutil utf-8-validate"
          MISSING=""
          for p in $(grep -o 'require("[^"./][^"]*")' .next/standalone/agent-runner.js | sed -E 's/require\("([^"]+)"\)/\1/' | grep -v '^node:' | sed -E 's#^(@[^/]+/[^/]+|[^/]+).*#\1#' | sort -u); do
            node -e "require('node:module').builtinModules.includes('$p') ? process.exit(0) : process.exit(1)" && continue
            case " $OPTIONAL " in *" $p "*) continue;; esac
            [ -f ".next/standalone/node_modules/$p/package.json" ] || MISSING="$MISSING $p"
          done
          if [ -n "$MISSING" ]; then echo "::error::agent-runner deps missing from standalone node_modules:$MISSING"; exit 1; fi

      # heavy-worker（后台重活进程）：打包方式与 agent-runner 同款；sharp 是原生模块
      # 不能进 bundle，留 external——next 自己用 sharp，standalone 追踪必然带上它。
      - name: Bundle heavy-worker
        run: |
          npm run build:worker
          test -f .next/standalone/node_modules/pg/package.json || { echo "::error::pg not traced into standalone"; exit 1; }
          test -f .next/standalone/node_modules/sharp/package.json || { echo "::error::sharp not traced into standalone"; exit 1; }

      # ── 4. Bundle ────────────────────────────────────────────────────────────
      - name: Bundle standalone output
        run: |
          # Next standalone needs static/ and public/ copied in manually.
          # 用 dir/. 语法拷内容——目标目录已存在时 `cp -r public target/public`
          # 会嵌套成 public/public/（线上字体 404 的元凶之一）
          mkdir -p .next/standalone/.next/static .next/standalone/public
          cp -r .next/static/. .next/standalone/.next/static/
          cp -r public/.       .next/standalone/public/
          # agent-runner 的 base prompt 从 <cwd>/openclaw-workspace 读（lib/agent/runtime/prompt.ts 的
          # WORKSPACE_FILES），不在 next 追踪范围内，只带这五个文件（README/HEARTBEAT 不进 bundle）；
          # pm2 里 agent-runner 的 cwd 指向 current/
          mkdir -p .next/standalone/openclaw-workspace
          cp openclaw-workspace/{AGENTS,SOUL,IDENTITY,USER,TOOLS}.md .next/standalone/openclaw-workspace/
          # 迁移（#561）：migrations 目录 + 指纹 SQL / 期望指纹 + dbmate 二进制随 bundle 走，
          # 服务器上不装任何东西。二进制来自 npm 的平台包（runner 是 linux-x64）。
          mkdir -p .next/standalone/db .next/standalone/bin
          cp -r db/migrations .next/standalone/db/
          cp db/fingerprint.sql db/schema-fingerprint.txt .next/standalone/db/
          cp node_modules/@dbmate/linux-x64/bin/dbmate .next/standalone/bin/dbmate
          chmod +x .next/standalone/bin/dbmate
          tar -czf /tmp/deploy_bundle.tar.gz -C .next/standalone .

      # ── 5. Setup SSH ─────────────────────────────────────────────────────────
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Set SSH alias
        run: |
          cat >> ~/.ssh/config <<EOF
          Host prod
            HostName ${{ secrets.SERVER_HOST }}
            User ${{ secrets.SERVER_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
          EOF

      # ── 6. Upload & Extract ──────────────────────────────────────────────────
      - name: Upload bundle
        run: |
          RELEASE="${{ github.run_number }}-${{ github.sha }}"
          RELEASE="${RELEASE:0:30}"   # keep it short
          RELEASE_DIR="/var/www/production-manager/releases/$RELEASE"
          echo "RELEASE=$RELEASE" >> $GITHUB_ENV
          echo "RELEASE_DIR=$RELEASE_DIR" >> $GITHUB_ENV

          ssh prod "mkdir -p $RELEASE_DIR" < /dev/null
          scp /tmp/deploy_bundle.tar.gz prod:/tmp/deploy_bundle.tar.gz
          ssh prod "tar -xzf /tmp/deploy_bundle.tar.gz -C $RELEASE_DIR && rm /tmp/deploy_bundle.tar.gz" < /dev/null

      # ── 7. Stage migration toolkit on server ─────────────────────────────────
      # 迁移以 postgres 用户执行（表 owner），它读不到 ubuntu 的 release 目录，所以
      # 把 dbmate + migrations + 指纹拷到 /tmp 并放开读权限，与旧流程的 /tmp/migration.sql
      # 同理。URL 走 Unix socket + peer auth，不需要任何密码。
      - name: Stage migration toolkit
        run: |
          ssh prod "
            rm -rf /tmp/deploy-db && mkdir -p /tmp/deploy-db &&
            cp -r ${{ env.RELEASE_DIR }}/db/migrations /tmp/deploy-db/migrations &&
            cp ${{ env.RELEASE_DIR }}/db/fingerprint.sql ${{ env.RELEASE_DIR }}/db/schema-fingerprint.txt /tmp/deploy-db/ &&
            cp ${{ env.RELEASE_DIR }}/bin/dbmate /tmp/deploy-db/dbmate &&
            chmod -R a+rX /tmp/deploy-db
          " < /dev/null

      # ── 8. DB migrations（dbmate，#561）──────────────────────────────────────
      # 「已执行」的唯一真相是库里的 schema_migrations 表；shared/db-applied.txt 退役。
      #
      # 闸一：库里有表却没有 schema_migrations → 拒绝。这是接管前建的库没记 baseline，
      #       让 dbmate 在它上面重放 baseline 不是我们要的（新机器空库才允许从 baseline 起）。
      # 闸二：有 pending 才备份（备份文件保留最近 5 份）。
      # 闸三：up 之后 status 必须 0 pending，否则红——不再有「跳过了也不知道」。
      # 闸四：线上结构指纹必须逐行等于仓库的 db/schema-fingerprint.txt，不等即红：
      #       「删了没删掉 / 记了没执行 / schema.sql 忘同步」全在这里现形。
      #       此时代码还没切换，老代码跑在新 schema 上（expand / contract 保证可行），
      #       红了就停在这里排查，不会发出去一个和库不匹配的版本。
      - name: Run DB migrations
        run: |
          SHARED="/var/www/production-manager/shared"
          URL="postgres:///script_editor?host=/var/run/postgresql&sslmode=disable"
          DBMATE="sudo -u postgres /tmp/deploy-db/dbmate --url '$URL' --migrations-dir /tmp/deploy-db/migrations --no-dump-schema"
          PSQL="sudo -u postgres psql -d script_editor -qAt"

          TABLES=$(ssh prod "$PSQL -c \"SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename <> 'schema_migrations'\"" < /dev/null)
          HAS_LEDGER=$(ssh prod "$PSQL -c \"SELECT to_regclass('public.schema_migrations') IS NOT NULL\"" < /dev/null)
          if [ "$TABLES" != "0" ] && [ "$HAS_LEDGER" != "t" ]; then
            echo "::error::线上库有 $TABLES 张表但没有 schema_migrations 记账——先按 #561 跑对账脚本并记 baseline，再发布"
            exit 1
          fi

          echo "── status（before）"
          ssh prod "$DBMATE status" < /dev/null | tee /tmp/status-before.txt
          PENDING=$(grep -c '^\[ \]' /tmp/status-before.txt || true)

          if [ "$PENDING" -gt 0 ]; then
            echo "Found $PENDING pending migration(s) — creating production DB backup..."
            BACKUP="pre_migration_${{ github.run_number }}_$(date +%Y%m%d_%H%M%S).pgdump"
            ssh prod "
              mkdir -p $SHARED/backups &&
              sudo -u postgres pg_dump -d script_editor --format=custom --compress=9 > $SHARED/backups/$BACKUP &&
              ls -lh $SHARED/backups/$BACKUP &&
              ls -1t $SHARED/backups/*.pgdump 2>/dev/null | tail -n +6 | xargs -r rm -f
            " < /dev/null
            echo "Backup saved to $SHARED/backups/$BACKUP"

            echo "── dbmate up"
            ssh prod "$DBMATE up" < /dev/null \
              || { echo "::error::MIGRATION FAILED — 该支已整体回滚（单事务），部署中止；备份在 $SHARED/backups/$BACKUP"; exit 1; }
          else
            echo "No pending migrations — backup skipped."
          fi

          echo "── status（after）：必须 0 pending"
          ssh prod "$DBMATE status --exit-code" < /dev/null \
            || { echo "::error::dbmate up 之后仍有 pending migration"; exit 1; }

          echo "── 结构指纹校验"
          ssh prod "$PSQL -f /tmp/deploy-db/fingerprint.sql" < /dev/null > /tmp/prod-fingerprint.txt
          if ! diff -u db/schema-fingerprint.txt /tmp/prod-fingerprint.txt > /tmp/fingerprint.diff; then
            echo "::error::线上 schema 与 db/schema-fingerprint.txt 不一致（- 期望 / + 线上）："
            cat /tmp/fingerprint.diff
            exit 1
          fi
          echo "线上 schema 指纹一致（$(wc -l < /tmp/prod-fingerprint.txt) 行）"

      # ── 9. Swap symlink & reload PM2 ─────────────────────────────────────────
      # pm2 进程定义收在仓库 deploy/ecosystem.config.js（含 agent-runner），每次发布
      # 覆盖到 shared/ 再 reload：文件里新出现的 app 会被拉起，已在跑的按各自模式换新。
      - name: Activate release
        run: |
          scp deploy/ecosystem.config.js prod:/var/www/production-manager/shared/ecosystem.config.js
          ssh prod "
            ln -snf ${{ env.RELEASE_DIR }} /var/www/production-manager/current &&
            pm2 reload /var/www/production-manager/shared/ecosystem.config.js --update-env
          " < /dev/null

      # ── 10. Clean up old releases (keep latest 5) ────────────────────────────
      - name: Clean old releases
        run: |
          ssh prod "
            ls -1dt /var/www/production-manager/releases/*/ |
            tail -n +6 |
            xargs rm -rf --
          " < /dev/null
