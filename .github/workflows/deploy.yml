name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0   # full history required for migration ordering

      # ── 2. Setup Node ────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      # ── 3. Install & Build ───────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      - name: Build (standalone)
        run: npm run build
        env:
          # Suppress build-time DB connections; env vars come from .env.local at runtime
          SKIP_ENV_VALIDATION: '1'

      # ── 4. Bundle ────────────────────────────────────────────────────────────
      - name: Bundle standalone output
        run: |
          # Next standalone needs static/ and public/ copied in manually
          cp -r .next/static .next/standalone/.next/static
          cp -r public       .next/standalone/public
          tar -czf /tmp/deploy_bundle.tar.gz -C .next/standalone .

      # ── 5. Setup SSH ─────────────────────────────────────────────────────────
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Set SSH alias
        run: |
          cat >> ~/.ssh/config <<EOF
          Host prod
            HostName ${{ secrets.SERVER_HOST }}
            User ${{ secrets.SERVER_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
          EOF

      # ── 6. Upload & Extract ──────────────────────────────────────────────────
      - name: Upload bundle
        run: |
          RELEASE="${{ github.run_number }}-${{ github.sha }}"
          RELEASE="${RELEASE:0:30}"   # keep it short
          RELEASE_DIR="/var/www/production-manager/releases/$RELEASE"
          echo "RELEASE=$RELEASE" >> $GITHUB_ENV
          echo "RELEASE_DIR=$RELEASE_DIR" >> $GITHUB_ENV

          ssh prod "mkdir -p $RELEASE_DIR" < /dev/null
          scp /tmp/deploy_bundle.tar.gz prod:/tmp/deploy_bundle.tar.gz
          ssh prod "tar -xzf /tmp/deploy_bundle.tar.gz -C $RELEASE_DIR && rm /tmp/deploy_bundle.tar.gz" < /dev/null

      # ── 7. Backup DB if migrations pending ──────────────────────────────────
      - name: Backup production DB before migrations
        run: |
          SHARED="/var/www/production-manager/shared"
          ORDERED=$(git log --reverse --diff-filter=A --format="%H" -- 'db/add-*.sql' 'db/migrate-*.sql'             | while read commit; do
                git diff-tree --no-commit-id -r --name-only --diff-filter=A "$commit" -- 'db/add-*.sql' 'db/migrate-*.sql' | sort
              done)
          ssh prod "cat $SHARED/db-applied.txt 2>/dev/null || true" < /dev/null > /tmp/db-applied-backup-check.txt
          PENDING=0
          while IFS= read -r FILEPATH; do
            FILENAME=$(basename "$FILEPATH")
            if [ -f "$FILEPATH" ] && ! grep -qxF "$FILENAME" /tmp/db-applied-backup-check.txt 2>/dev/null; then
              PENDING=$((PENDING + 1))
            fi
          done <<< "$ORDERED"
          if [ "$PENDING" -gt 0 ]; then
            echo "Found $PENDING pending migration(s) — creating production DB backup..."
            BACKUP="pre_migration_${{ github.run_number }}_$(date +%Y%m%d_%H%M%S).pgdump"
            ssh prod "
              mkdir -p $SHARED/backups &&
              sudo -u postgres pg_dump -d script_editor --format=custom --compress=9 > $SHARED/backups/$BACKUP &&
              ls -lh $SHARED/backups/$BACKUP &&
              ls -1t $SHARED/backups/*.pgdump 2>/dev/null | tail -n +6 | xargs -r rm -f
            " < /dev/null
            echo "Backup saved to $SHARED/backups/$BACKUP"
          else
            echo "No pending migrations — backup skipped."
          fi

      # ── 8. Run DB migrations ───────────────────────────────────────────────
      - name: Run DB migrations
        run: |
          SHARED="/var/www/production-manager/shared"
          DB="script_editor"

          # Get all db/add-*.sql and db/migrate-*.sql files ordered by first-commit date (oldest first),
          # alphabetically within the same commit.
          ORDERED=$(git log --reverse --diff-filter=A --format="%H" -- 'db/add-*.sql' 'db/migrate-*.sql' \
            | while read commit; do
                git diff-tree --no-commit-id -r --name-only --diff-filter=A "$commit" -- 'db/add-*.sql' 'db/migrate-*.sql' | sort
              done)

          if [ -z "$ORDERED" ]; then
            echo "No migration files found."
            exit 0
          fi

          # Fetch the applied manifest from server (empty if not yet created)
          ssh prod "cat $SHARED/db-applied.txt 2>/dev/null || true" < /dev/null > /tmp/db-applied.txt

          echo "Already applied:"
          cat /tmp/db-applied.txt || echo "(none)"

          while IFS= read -r FILEPATH; do
            FILENAME=$(basename "$FILEPATH")
            if grep -qxF "$FILENAME" /tmp/db-applied.txt 2>/dev/null; then
              echo "SKIP  $FILENAME (already applied)"
            elif [ ! -f "$FILEPATH" ]; then
              # File was deleted from the repo (e.g. consolidated into schema.sql).
              # Mark as applied so future runs don't warn about it.
              echo "SKIP  $FILENAME (deleted from repo, marking as applied)"
              ssh prod "echo '$FILENAME' >> $SHARED/db-applied.txt" < /dev/null
              echo "$FILENAME" >> /tmp/db-applied.txt
            else
              echo "APPLY $FILENAME"
              scp "$FILEPATH" prod:/tmp/migration.sql
              # `< /dev/null` on every ssh call below is required: this loop's stdin is
              # the migration file list (via `<<< "$ORDERED"`), and ssh forwards local
              # stdin to the remote command by default. Without this, ssh competes with
              # `read -r FILEPATH` for the same fd and can silently swallow the next
              # line(s), dropping migrations from a run with 2+ pending files without
              # any error (this is exactly what happened to migrate-cue-list-role.sql).
              ssh prod "sudo -u postgres psql -d $DB -f /tmp/migration.sql && rm /tmp/migration.sql" < /dev/null
              # Record in manifest
              ssh prod "echo '$FILENAME' >> $SHARED/db-applied.txt" < /dev/null
              echo "$FILENAME" >> /tmp/db-applied.txt
            fi
          done <<< "$ORDERED"

      # ── 9. Swap symlink & reload PM2 ─────────────────────────────────────────
      - name: Activate release
        run: |
          ssh prod "
            ln -snf ${{ env.RELEASE_DIR }} /var/www/production-manager/current &&
            pm2 reload /var/www/production-manager/shared/ecosystem.config.js --update-env
          " < /dev/null

      # ── 9.5 Sync OpenClaw plugin (clickin-memory) ────────────────────────────
      # 插件安装在 shared/（稳定路径，openclaw install --link 的 symlink 不能
      # 指向会被轮换清理的 releases/）。用 git tree hash 判断变更：没变则完全
      # 跳过（不重启 gateway，不打断进行中的 agent run）。
      - name: Sync OpenClaw plugin
        run: |
          SHARED="/var/www/production-manager/shared"
          PLUGIN_DIR="$SHARED/openclaw-plugins/clickin-memory"
          TREE_HASH=$(git rev-parse HEAD:openclaw-plugins/clickin-memory)
          REMOTE_HASH=$(ssh prod "cat $PLUGIN_DIR.tree-hash 2>/dev/null" < /dev/null || true)

          if [ "$TREE_HASH" = "$REMOTE_HASH" ]; then
            echo "Plugin unchanged ($TREE_HASH) — skipping sync and gateway restart."
            exit 0
          fi

          echo "Plugin changed: ${REMOTE_HASH:-<none>} → $TREE_HASH"
          ssh prod "mkdir -p $SHARED/openclaw-plugins && rm -rf $PLUGIN_DIR.new" < /dev/null
          scp -r openclaw-plugins/clickin-memory prod:$PLUGIN_DIR.new
          # 目录保持部署用户所有（下次 CD 才能写），openclaw 用户只需读（--link）。
          # chmod 只递归本插件目录，不碰 openclaw-plugins 下其他插件的权限；
          # 父链补 x 位保证 openclaw 用户可穿越到叶子目录。
          ssh prod "
            rm -rf $PLUGIN_DIR && mv $PLUGIN_DIR.new $PLUGIN_DIR &&
            chmod -R a+rX $PLUGIN_DIR &&
            chmod a+x $SHARED $SHARED/openclaw-plugins &&
            echo '$TREE_HASH' > $PLUGIN_DIR.tree-hash
          " < /dev/null

          # 服务器上团队实例以专用 openclaw 用户跑默认 profile
          # （/home/openclaw/.openclaw），binary 在 /opt/node/bin（不在部署
          # 用户 PATH 里）。未装好时软失败：不阻塞主应用部署，留 warning。
          # 注意：sudo -u openclaw 依赖部署用户的 NOPASSWD sudo（与上面
          # sudo -u postgres 跑迁移同一前提）——如果 install 长期报 warning，
          # 先排查 sudoers，别当成 openclaw 未安装。
          ssh prod "
            OC='sudo -u openclaw /opt/node/bin/openclaw'
            if [ -x /opt/node/bin/openclaw ]; then
              if ! \$OC plugins list 2>/dev/null | grep -q clickin-memory; then
                \$OC plugins install --link $PLUGIN_DIR ||
                  echo '::warning::clickin-memory install failed — run install --link manually'
              fi
              \$OC gateway restart ||
                echo '::warning::team gateway restart failed — restart manually to load plugin changes'
            else
              echo '::warning::openclaw not found at /opt/node/bin — plugin synced but not installed'
            fi
          " < /dev/null

      # ── 10. Clean up old releases (keep latest 5) ────────────────────────────
      - name: Clean old releases
        run: |
          ssh prod "
            ls -1dt /var/www/production-manager/releases/*/ |
            tail -n +6 |
            xargs rm -rf --
          " < /dev/null
