name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0   # full history required for migration ordering

      # ── 2. Setup Node ────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      # ── 3. Install & Build ───────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      - name: Build (standalone)
        run: npm run build
        env:
          # Suppress build-time DB connections; env vars come from .env.local at runtime
          SKIP_ENV_VALIDATION: '1'

      # agent-runner（#367）不是 next 的一部分：esbuild 把 agent-runner/index.ts + lib/ +
      # vendor/ + 全部 npm 依赖（含 @openclaw/ai）打成单文件放进 standalone 目录，随 bundle
      # 一起发。只有 pg 留 external（next 的 standalone 追踪会带上完整的 pg）；
      # @opentelemetry/api / bufferutil / utf-8-validate 是 provider SDK / ws 的可选依赖，
      # 不装也能跑（本机在只有 pg 的隔离目录里验证过）。
      # 教训（PR #371 首发）：不能只看 node_modules/<pkg> 目录存在——standalone 只拷 next
      # 自己用到的文件，@openclaw/ai 的 package.json / 子路径都没有，runner 起不来。
      - name: Bundle agent-runner
        run: |
          npm run build:runner
          test -f .next/standalone/node_modules/pg/package.json || { echo "::error::pg not traced into standalone"; exit 1; }
          OPTIONAL="@opentelemetry/api bufferutil utf-8-validate"
          MISSING=""
          for p in $(grep -o 'require("[^"./][^"]*")' .next/standalone/agent-runner.js | sed -E 's/require\("([^"]+)"\)/\1/' | grep -v '^node:' | sed -E 's#^(@[^/]+/[^/]+|[^/]+).*#\1#' | sort -u); do
            node -e "require('node:module').builtinModules.includes('$p') ? process.exit(0) : process.exit(1)" && continue
            case " $OPTIONAL " in *" $p "*) continue;; esac
            [ -f ".next/standalone/node_modules/$p/package.json" ] || MISSING="$MISSING $p"
          done
          if [ -n "$MISSING" ]; then echo "::error::agent-runner deps missing from standalone node_modules:$MISSING"; exit 1; fi

      # ── 4. Bundle ────────────────────────────────────────────────────────────
      - name: Bundle standalone output
        run: |
          # Next standalone needs static/ and public/ copied in manually.
          # 用 dir/. 语法拷内容——目标目录已存在时 `cp -r public target/public`
          # 会嵌套成 public/public/（线上字体 404 的元凶之一）
          mkdir -p .next/standalone/.next/static .next/standalone/public
          cp -r .next/static/. .next/standalone/.next/static/
          cp -r public/.       .next/standalone/public/
          # agent-runner 的 base prompt 从 <cwd>/openclaw-workspace 读（lib/agent-runtime/prompt.ts 的
          # WORKSPACE_FILES），不在 next 追踪范围内，只带这五个文件（README/HEARTBEAT 不进 bundle）；
          # pm2 里 agent-runner 的 cwd 指向 current/
          mkdir -p .next/standalone/openclaw-workspace
          cp openclaw-workspace/{AGENTS,SOUL,IDENTITY,USER,TOOLS}.md .next/standalone/openclaw-workspace/
          tar -czf /tmp/deploy_bundle.tar.gz -C .next/standalone .

      # ── 5. Setup SSH ─────────────────────────────────────────────────────────
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Set SSH alias
        run: |
          cat >> ~/.ssh/config <<EOF
          Host prod
            HostName ${{ secrets.SERVER_HOST }}
            User ${{ secrets.SERVER_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
          EOF

      # ── 6. Upload & Extract ──────────────────────────────────────────────────
      - name: Upload bundle
        run: |
          RELEASE="${{ github.run_number }}-${{ github.sha }}"
          RELEASE="${RELEASE:0:30}"   # keep it short
          RELEASE_DIR="/var/www/production-manager/releases/$RELEASE"
          echo "RELEASE=$RELEASE" >> $GITHUB_ENV
          echo "RELEASE_DIR=$RELEASE_DIR" >> $GITHUB_ENV

          ssh prod "mkdir -p $RELEASE_DIR" < /dev/null
          scp /tmp/deploy_bundle.tar.gz prod:/tmp/deploy_bundle.tar.gz
          ssh prod "tar -xzf /tmp/deploy_bundle.tar.gz -C $RELEASE_DIR && rm /tmp/deploy_bundle.tar.gz" < /dev/null

      # ── 7. Backup DB if migrations pending ──────────────────────────────────
      - name: Backup production DB before migrations
        run: |
          SHARED="/var/www/production-manager/shared"
          # 只部署当前 HEAD 仍存在的迁移。分支中途新增后又改名/删除的文件不能进入
          # 清单，否则会把从未进主干的名字写成「已执行」幽灵记录，更危险时还会先
          # 执行一份已经废弃的表结构。awk 同时去掉删除后重加造成的重复路径。
          ORDERED=$(git log --reverse --diff-filter=A --format="%H" -- 'db/add-*.sql' 'db/migrate-*.sql'             | while read commit; do
                git diff-tree --no-commit-id -r --name-only --diff-filter=A "$commit" -- 'db/add-*.sql' 'db/migrate-*.sql' | sort
              done | awk '!seen[$0]++' | while IFS= read -r filepath; do
                [ -f "$filepath" ] && printf '%s\n' "$filepath"
              done)
          ssh prod "cat $SHARED/db-applied.txt 2>/dev/null || true" < /dev/null > /tmp/db-applied-backup-check.txt
          PENDING=0
          while IFS= read -r FILEPATH; do
            FILENAME=$(basename "$FILEPATH")
            if [ -f "$FILEPATH" ] && ! grep -qxF "$FILENAME" /tmp/db-applied-backup-check.txt 2>/dev/null; then
              PENDING=$((PENDING + 1))
            fi
          done <<< "$ORDERED"
          if [ "$PENDING" -gt 0 ]; then
            echo "Found $PENDING pending migration(s) — creating production DB backup..."
            BACKUP="pre_migration_${{ github.run_number }}_$(date +%Y%m%d_%H%M%S).pgdump"
            ssh prod "
              mkdir -p $SHARED/backups &&
              sudo -u postgres pg_dump -d script_editor --format=custom --compress=9 > $SHARED/backups/$BACKUP &&
              ls -lh $SHARED/backups/$BACKUP &&
              ls -1t $SHARED/backups/*.pgdump 2>/dev/null | tail -n +6 | xargs -r rm -f
            " < /dev/null
            echo "Backup saved to $SHARED/backups/$BACKUP"
          else
            echo "No pending migrations — backup skipped."
          fi

      # ── 8. Run DB migrations ───────────────────────────────────────────────
      - name: Run DB migrations
        run: |
          SHARED="/var/www/production-manager/shared"
          DB="script_editor"

          # Get all db/add-*.sql and db/migrate-*.sql files ordered by first-commit date (oldest first),
          # alphabetically within the same commit.
          ORDERED=$(git log --reverse --diff-filter=A --format="%H" -- 'db/add-*.sql' 'db/migrate-*.sql' \
            | while read commit; do
                git diff-tree --no-commit-id -r --name-only --diff-filter=A "$commit" -- 'db/add-*.sql' 'db/migrate-*.sql' | sort
              done | awk '!seen[$0]++' | while IFS= read -r filepath; do
                [ -f "$filepath" ] && printf '%s\n' "$filepath"
              done)

          if [ -z "$ORDERED" ]; then
            echo "No migration files found."
            exit 0
          fi

          # Fetch the applied manifest from server (empty if not yet created)
          ssh prod "cat $SHARED/db-applied.txt 2>/dev/null || true" < /dev/null > /tmp/db-applied.txt

          echo "Already applied:"
          cat /tmp/db-applied.txt || echo "(none)"

          while IFS= read -r FILEPATH; do
            FILENAME=$(basename "$FILEPATH")
            if grep -qxF "$FILENAME" /tmp/db-applied.txt 2>/dev/null; then
              echo "SKIP  $FILENAME (already applied)"
            else
              echo "APPLY $FILENAME"
              scp "$FILEPATH" prod:/tmp/migration.sql
              # `< /dev/null` on every ssh call below is required: this loop's stdin is
              # the migration file list (via `<<< "$ORDERED"`), and ssh forwards local
              # stdin to the remote command by default. Without this, ssh competes with
              # `read -r FILEPATH` for the same fd and can silently swallow the next
              # line(s), dropping migrations from a run with 2+ pending files without
              # any error (this is exactly what happened to migrate-cue-list-role.sql).
              # ON_ERROR_STOP：脚本错误即非零退出（此前 psql -f 出错仍退 0，失败被
              # 静默记入 db-applied.txt——批A 部署事故）。显式 || exit 1 确保记账
              # 语句不会在失败后执行，不依赖外层 shell 的 -e 隐式行为。
              # 失败时 /tmp/migration.sql 留在服务器上供排查（有意为之）。
              ssh prod "sudo -u postgres psql -v ON_ERROR_STOP=1 -d $DB -f /tmp/migration.sql && rm /tmp/migration.sql" < /dev/null \
                || { echo "MIGRATION FAILED: $FILENAME — aborting deploy, NOT recorded in manifest"; exit 1; }
              # Record in manifest
              ssh prod "echo '$FILENAME' >> $SHARED/db-applied.txt" < /dev/null
              echo "$FILENAME" >> /tmp/db-applied.txt
            fi
          done <<< "$ORDERED"

      # ── 9. Swap symlink & reload PM2 ─────────────────────────────────────────
      # pm2 进程定义收在仓库 deploy/ecosystem.config.js（含 agent-runner），每次发布
      # 覆盖到 shared/ 再 reload：文件里新出现的 app 会被拉起，已在跑的按各自模式换新。
      - name: Activate release
        run: |
          scp deploy/ecosystem.config.js prod:/var/www/production-manager/shared/ecosystem.config.js
          ssh prod "
            ln -snf ${{ env.RELEASE_DIR }} /var/www/production-manager/current &&
            pm2 reload /var/www/production-manager/shared/ecosystem.config.js --update-env
          " < /dev/null

      # ── 10. Clean up old releases (keep latest 5) ────────────────────────────
      - name: Clean old releases
        run: |
          ssh prod "
            ls -1dt /var/www/production-manager/releases/*/ |
            tail -n +6 |
            xargs rm -rf --
          " < /dev/null
