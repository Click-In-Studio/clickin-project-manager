name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0   # full history required for migration ordering

      # ── 2. Setup Node ────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      # ── 3. Install & Build ───────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      - name: Build (standalone)
        run: npm run build
        env:
          # Suppress build-time DB connections; env vars come from .env.local at runtime
          SKIP_ENV_VALIDATION: '1'

      # agent-runner（#367）不是 next 的一部分：esbuild 把 agent-runner/index.ts + lib/ +
      # vendor/ + 全部 npm 依赖（含 @openclaw/ai）打成单文件放进 standalone 目录，随 bundle
      # 一起发。只有 pg 留 external（next 的 standalone 追踪会带上完整的 pg）；
      # @opentelemetry/api / bufferutil / utf-8-validate 是 provider SDK / ws 的可选依赖，
      # 不装也能跑（本机在只有 pg 的隔离目录里验证过）。
      # 教训（PR #371 首发）：不能只看 node_modules/<pkg> 目录存在——standalone 只拷 next
      # 自己用到的文件，@openclaw/ai 的 package.json / 子路径都没有，runner 起不来。
      - name: Bundle agent-runner
        run: |
          npm run build:runner
          test -f .next/standalone/node_modules/pg/package.json || { echo "::error::pg not traced into standalone"; exit 1; }
          OPTIONAL="@opentelemetry/api bufferutil utf-8-validate"
          MISSING=""
          for p in $(grep -o 'require("[^"./][^"]*")' .next/standalone/agent-runner.js | sed -E 's/require\("([^"]+)"\)/\1/' | grep -v '^node:' | sed -E 's#^(@[^/]+/[^/]+|[^/]+).*#\1#' | sort -u); do
            node -e "require('node:module').builtinModules.includes('$p') ? process.exit(0) : process.exit(1)" && continue
            case " $OPTIONAL " in *" $p "*) continue;; esac
            [ -f ".next/standalone/node_modules/$p/package.json" ] || MISSING="$MISSING $p"
          done
          if [ -n "$MISSING" ]; then echo "::error::agent-runner deps missing from standalone node_modules:$MISSING"; exit 1; fi

      # ── 4. Bundle ────────────────────────────────────────────────────────────
      - name: Bundle standalone output
        run: |
          # Next standalone needs static/ and public/ copied in manually.
          # 用 dir/. 语法拷内容——目标目录已存在时 `cp -r public target/public`
          # 会嵌套成 public/public/（线上字体 404 的元凶之一）
          mkdir -p .next/standalone/.next/static .next/standalone/public
          cp -r .next/static/. .next/standalone/.next/static/
          cp -r public/.       .next/standalone/public/
          # agent-runner 的 base prompt 六件套从 <cwd>/openclaw-workspace 读（lib/agent-runtime/prompt.ts），
          # 不在 next 追踪范围内，手动带上；pm2 里 agent-runner 的 cwd 指向 current/
          cp -r openclaw-workspace .next/standalone/openclaw-workspace
          tar -czf /tmp/deploy_bundle.tar.gz -C .next/standalone .

      # ── 5. Setup SSH ─────────────────────────────────────────────────────────
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Set SSH alias
        run: |
          cat >> ~/.ssh/config <<EOF
          Host prod
            HostName ${{ secrets.SERVER_HOST }}
            User ${{ secrets.SERVER_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
          EOF

      # ── 6. Upload & Extract ──────────────────────────────────────────────────
      - name: Upload bundle
        run: |
          RELEASE="${{ github.run_number }}-${{ github.sha }}"
          RELEASE="${RELEASE:0:30}"   # keep it short
          RELEASE_DIR="/var/www/production-manager/releases/$RELEASE"
          echo "RELEASE=$RELEASE" >> $GITHUB_ENV
          echo "RELEASE_DIR=$RELEASE_DIR" >> $GITHUB_ENV

          ssh prod "mkdir -p $RELEASE_DIR" < /dev/null
          scp /tmp/deploy_bundle.tar.gz prod:/tmp/deploy_bundle.tar.gz
          ssh prod "tar -xzf /tmp/deploy_bundle.tar.gz -C $RELEASE_DIR && rm /tmp/deploy_bundle.tar.gz" < /dev/null

      # ── 7. Backup DB if migrations pending ──────────────────────────────────
      - name: Backup production DB before migrations
        run: |
          SHARED="/var/www/production-manager/shared"
          # 只部署当前 HEAD 仍存在的迁移。分支中途新增后又改名/删除的文件不能进入
          # 清单，否则会把从未进主干的名字写成「已执行」幽灵记录，更危险时还会先
          # 执行一份已经废弃的表结构。awk 同时去掉删除后重加造成的重复路径。
          ORDERED=$(git log --reverse --diff-filter=A --format="%H" -- 'db/add-*.sql' 'db/migrate-*.sql'             | while read commit; do
                git diff-tree --no-commit-id -r --name-only --diff-filter=A "$commit" -- 'db/add-*.sql' 'db/migrate-*.sql' | sort
              done | awk '!seen[$0]++' | while IFS= read -r filepath; do
                [ -f "$filepath" ] && printf '%s\n' "$filepath"
              done)
          ssh prod "cat $SHARED/db-applied.txt 2>/dev/null || true" < /dev/null > /tmp/db-applied-backup-check.txt
          PENDING=0
          while IFS= read -r FILEPATH; do
            FILENAME=$(basename "$FILEPATH")
            if [ -f "$FILEPATH" ] && ! grep -qxF "$FILENAME" /tmp/db-applied-backup-check.txt 2>/dev/null; then
              PENDING=$((PENDING + 1))
            fi
          done <<< "$ORDERED"
          if [ "$PENDING" -gt 0 ]; then
            echo "Found $PENDING pending migration(s) — creating production DB backup..."
            BACKUP="pre_migration_${{ github.run_number }}_$(date +%Y%m%d_%H%M%S).pgdump"
            ssh prod "
              mkdir -p $SHARED/backups &&
              sudo -u postgres pg_dump -d script_editor --format=custom --compress=9 > $SHARED/backups/$BACKUP &&
              ls -lh $SHARED/backups/$BACKUP &&
              ls -1t $SHARED/backups/*.pgdump 2>/dev/null | tail -n +6 | xargs -r rm -f
            " < /dev/null
            echo "Backup saved to $SHARED/backups/$BACKUP"
          else
            echo "No pending migrations — backup skipped."
          fi

      # ── 8. Run DB migrations ───────────────────────────────────────────────
      - name: Run DB migrations
        run: |
          SHARED="/var/www/production-manager/shared"
          DB="script_editor"

          # Get all db/add-*.sql and db/migrate-*.sql files ordered by first-commit date (oldest first),
          # alphabetically within the same commit.
          ORDERED=$(git log --reverse --diff-filter=A --format="%H" -- 'db/add-*.sql' 'db/migrate-*.sql' \
            | while read commit; do
                git diff-tree --no-commit-id -r --name-only --diff-filter=A "$commit" -- 'db/add-*.sql' 'db/migrate-*.sql' | sort
              done | awk '!seen[$0]++' | while IFS= read -r filepath; do
                [ -f "$filepath" ] && printf '%s\n' "$filepath"
              done)

          if [ -z "$ORDERED" ]; then
            echo "No migration files found."
            exit 0
          fi

          # Fetch the applied manifest from server (empty if not yet created)
          ssh prod "cat $SHARED/db-applied.txt 2>/dev/null || true" < /dev/null > /tmp/db-applied.txt

          echo "Already applied:"
          cat /tmp/db-applied.txt || echo "(none)"

          while IFS= read -r FILEPATH; do
            FILENAME=$(basename "$FILEPATH")
            if grep -qxF "$FILENAME" /tmp/db-applied.txt 2>/dev/null; then
              echo "SKIP  $FILENAME (already applied)"
            else
              echo "APPLY $FILENAME"
              scp "$FILEPATH" prod:/tmp/migration.sql
              # `< /dev/null` on every ssh call below is required: this loop's stdin is
              # the migration file list (via `<<< "$ORDERED"`), and ssh forwards local
              # stdin to the remote command by default. Without this, ssh competes with
              # `read -r FILEPATH` for the same fd and can silently swallow the next
              # line(s), dropping migrations from a run with 2+ pending files without
              # any error (this is exactly what happened to migrate-cue-list-role.sql).
              # ON_ERROR_STOP：脚本错误即非零退出（此前 psql -f 出错仍退 0，失败被
              # 静默记入 db-applied.txt——批A 部署事故）。显式 || exit 1 确保记账
              # 语句不会在失败后执行，不依赖外层 shell 的 -e 隐式行为。
              # 失败时 /tmp/migration.sql 留在服务器上供排查（有意为之）。
              ssh prod "sudo -u postgres psql -v ON_ERROR_STOP=1 -d $DB -f /tmp/migration.sql && rm /tmp/migration.sql" < /dev/null \
                || { echo "MIGRATION FAILED: $FILENAME — aborting deploy, NOT recorded in manifest"; exit 1; }
              # Record in manifest
              ssh prod "echo '$FILENAME' >> $SHARED/db-applied.txt" < /dev/null
              echo "$FILENAME" >> /tmp/db-applied.txt
            fi
          done <<< "$ORDERED"

      # ── 9. Swap symlink & reload PM2 ─────────────────────────────────────────
      # pm2 进程定义收在仓库 deploy/ecosystem.config.js（含 agent-runner），每次发布
      # 覆盖到 shared/ 再 reload：文件里新出现的 app 会被拉起，已在跑的按各自模式换新。
      - name: Activate release
        run: |
          scp deploy/ecosystem.config.js prod:/var/www/production-manager/shared/ecosystem.config.js
          ssh prod "
            ln -snf ${{ env.RELEASE_DIR }} /var/www/production-manager/current &&
            pm2 reload /var/www/production-manager/shared/ecosystem.config.js --update-env
          " < /dev/null

      # ── 9.5 Sync OpenClaw plugin (clickin-memory) ────────────────────────────
      # 插件安装在 shared/（稳定路径，openclaw install --link 的 symlink 不能
      # 指向会被轮换清理的 releases/）。用 git tree hash 判断变更：没变则完全
      # 跳过（不重启 gateway，不打断进行中的 agent run）。
      - name: Sync OpenClaw plugin
        run: |
          SHARED="/var/www/production-manager/shared"
          PLUGIN_DIR="$SHARED/openclaw-plugins/clickin-memory"
          TREE_HASH=$(git rev-parse HEAD:openclaw-plugins/clickin-memory)
          REMOTE_HASH=$(ssh prod "cat $PLUGIN_DIR.tree-hash 2>/dev/null" < /dev/null || true)

          if [ "$TREE_HASH" = "$REMOTE_HASH" ]; then
            echo "Plugin unchanged ($TREE_HASH) — skipping sync and gateway restart."
            exit 0
          fi

          echo "Plugin changed: ${REMOTE_HASH:-<none>} → $TREE_HASH"
          ssh prod "mkdir -p $SHARED/openclaw-plugins && rm -rf $PLUGIN_DIR.new" < /dev/null
          scp -r openclaw-plugins/clickin-memory prod:$PLUGIN_DIR.new
          # OpenClaw 对 linked 插件源做所有权检查：必须属于运行用户（openclaw）
          # 或 root，部署用户（ubuntu, uid 1000）会被 'blocked plugin candidate:
          # suspicious ownership' 拦截（真机踩过）。因此插件目录 chown 给 root，
          # 本目录的增删改一律走 sudo；tree-hash 哨兵留在 ubuntu 所有的父目录。
          ssh prod "
            sudo rm -rf $PLUGIN_DIR &&
            sudo mv $PLUGIN_DIR.new $PLUGIN_DIR &&
            sudo chown -R root:root $PLUGIN_DIR &&
            sudo chmod -R a+rX $PLUGIN_DIR &&
            chmod a+x $SHARED $SHARED/openclaw-plugins &&
            echo '$TREE_HASH' > $PLUGIN_DIR.tree-hash
          " < /dev/null

          # 服务器上团队实例以专用 openclaw 用户跑默认 profile
          # （/home/openclaw/.openclaw），binary 在 /opt/node/bin（不在部署
          # 用户 PATH 里）。未装好时软失败：不阻塞主应用部署，留 warning。
          # 注意：sudo -u openclaw 依赖部署用户的 NOPASSWD sudo（与上面
          # sudo -u postgres 跑迁移同一前提）——如果 install 长期报 warning，
          # 先排查 sudoers，别当成 openclaw 未安装。
          ssh prod "
            OC='sudo -u openclaw /opt/node/bin/openclaw'
            if [ -x /opt/node/bin/openclaw ]; then
              # 已安装判断用 inspect 的退出码（实测未安装 exit 1）。不能用
              # plugins list | grep：配置里有 entry 但插件未装时，list 的
              # 'plugin not found: clickin-memory' 警告文本会喂饱 grep，
              # 导致 install 被永久跳过（真机踩过）。
              if ! \$OC plugins inspect clickin-memory >/dev/null 2>&1; then
                \$OC plugins install --link $PLUGIN_DIR ||
                  echo '::warning::clickin-memory install failed — run install --link manually'
              fi
              # gateway 由 systemd（openclaw.service）管理——必须走 systemctl。
              # CLI 的 gateway restart 会把它当 unmanaged process 直接杀掉，
              # systemd 不会拉起，端口 18790 就此死掉（真机踩过：每次 CD 后
              # webchat ECONNREFUSED，需人工 systemctl start）。
              sudo systemctl restart openclaw ||
                echo '::warning::systemctl restart openclaw failed — restart manually to load plugin changes'
            else
              echo '::warning::openclaw not found at /opt/node/bin — plugin synced but not installed'
            fi
          " < /dev/null

      # ── 9.6 Sync OpenClaw workspace（系统级 AGENTS.md 等） ────────────────────
      # openclaw-workspace/ 是团队实例 workspace 文件的唯一事实来源（agents.md
      # 三级注入的系统级——刻意不做在线编辑，死命令进版本控制）。tree hash 没变
      # 则完全跳过。与插件目录不同，workspace 文件必须属 openclaw 用户（那是
      # agent 的家目录）；服务器上被手改/被 agent 自改的内容会在下次内容变更的
      # 部署里被覆盖——这是特性不是事故。运行时状态文件（openclaw-workspace-
      # state.json 等）不在同步清单里，永不触碰。不重启 gateway：workspace
      # 文件按 OpenClaw 惯例每 run 读取，无需进程重启即生效。
      - name: Sync OpenClaw workspace
        run: |
          SHARED="/var/www/production-manager/shared"
          WS_DIR="/home/openclaw/.openclaw/workspace-team"
          # 同步清单单一来源：scp 载荷与变更指纹都从它派生——指纹只覆盖真正
          # 会被复制的文件（README.md 是仓库侧说明不进 workspace，它的变更
          # 不触发同步、也不影响跳过判定）。
          WS_FILES="AGENTS.md SOUL.md IDENTITY.md TOOLS.md HEARTBEAT.md USER.md"
          PATHS=""; for f in $WS_FILES; do PATHS="$PATHS openclaw-workspace/$f"; done
          TREE_HASH=$(git ls-tree HEAD -- $PATHS | git hash-object --stdin)
          REMOTE_HASH=$(ssh prod "cat $SHARED/openclaw-workspace.tree-hash 2>/dev/null" < /dev/null || true)

          if [ "$TREE_HASH" = "$REMOTE_HASH" ]; then
            echo "Workspace unchanged ($TREE_HASH) — skipping sync."
            exit 0
          fi

          echo "Workspace changed: ${REMOTE_HASH:-<none>} → $TREE_HASH"
          # 全程软失败：workspace 同步是增强项，任何一步挂掉都不阻塞主应用
          # 部署，只留 warning（与插件同步段的失败语义一致）。
          {
            ssh prod "rm -rf /tmp/openclaw-workspace.new && mkdir -p /tmp/openclaw-workspace.new" < /dev/null &&
            scp $PATHS prod:/tmp/openclaw-workspace.new/ &&
            ssh prod "
              sudo install -d -o openclaw -g openclaw $WS_DIR &&
              sudo install -o openclaw -g openclaw -m 0644 /tmp/openclaw-workspace.new/*.md $WS_DIR/ &&
              rm -rf /tmp/openclaw-workspace.new &&
              echo '$TREE_HASH' > $SHARED/openclaw-workspace.tree-hash
            " < /dev/null
          } ||
            echo '::warning::openclaw workspace sync failed — AGENTS.md on server may be stale'

      # ── 10. Clean up old releases (keep latest 5) ────────────────────────────
      - name: Clean old releases
        run: |
          ssh prod "
            ls -1dt /var/www/production-manager/releases/*/ |
            tail -n +6 |
            xargs rm -rf --
          " < /dev/null
