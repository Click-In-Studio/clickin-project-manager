name: PR Automation

on:
  pull_request:
    # labeled / unlabeled 是给 changelog-check 的：打上 chore 标签就该撤掉提醒
    types: [opened, synchronize, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to re-run AI review on'
        required: true
        type: number

jobs:
  # Assign the PR author as assignee so ownership is always visible in the PR list.
  assign-author:
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: [context.payload.pull_request.user.login],
            });

  # Post (or update) a migration checklist comment when db/migrations/*.sql
  # files are present in the PR. Removes the comment if those files are later
  # removed from the PR.
  migration-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const MARKER = '<!-- migration-checklist -->';
            const pr = context.payload.pull_request;

            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const migrationFiles = files
              .filter(f => /^db\/migrations\/.*\.sql$/.test(f.filename))
              .map(f => f.filename);

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
            });
            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.includes(MARKER)
            );

            if (migrationFiles.length === 0) {
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                });
              }
              return;
            }

            const fileList = migrationFiles.map(f => `- \`${f}\``).join('\n');
            const names = migrationFiles.map(f => f.split('/').pop().replace(/^\d{14}_/, '').replace(/\.sql$/, ''));

            const body = [
              MARKER,
              '## ⚠️ 此 PR 包含数据库 Migration（dbmate）',
              '',
              '以下文件将在合并后由 CD 以 `dbmate up` **自动执行**（单事务，失败整体回滚、部署中止）：',
              fileList,
              '',
              '**Reviewer 检查项（DEV_GUIDE §6）：**',
              '- [ ] `-- migrate:up` / `-- migrate:down` 两段齐全；只加不删的写真 down，删列删表的 down 写 `RAISE EXCEPTION`',
              '- [ ] expand / contract：本 PR 若删列 / 删表 / 改类型，当前线上（N-1）代码在新 schema 上仍能跑；删除应放在停用代码的下一个版本',
              '- [ ] DDL 已同步进 `db/schema.sql`，且 `npm run db:check -- --update` 重生成了 `db/schema-fingerprint.txt`（CI 的 Schema consistency check 绿）',
              '- [ ] 破坏性 / 数据迁移带 `tests/migrations/<name>.migration.test.ts` 三层测试 + `<name>.snapshot.ts` hook（name = ' + names.map(n => '`' + n + '`').join(', ') + '）',
              '- [ ] 迁移里若引用权限键 / 角色名等应用词汇，与 `lib/` 常量一致',
              '',
              '**合并部署后核实**（CD 自己会做，这里是手动看的方法）：',
              '```bash',
              "sudo -u postgres psql -d script_editor -c \"SELECT * FROM schema_migrations ORDER BY version\"",
              '```',
              '',
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }

  # 更新日志提醒（#569，DEV_GUIDE §12.8）：功能 PR 要在 content/changelog/unreleased/
  # 留一条给用户看的条目。豁免两种：改动全在文档 / 测试 / CI / 迁移这些用户碰不到的
  # 路径里（按路径判，不靠标签——docs/help 是手册内容 PR 的标签，功能 PR 顺手打上就
  # 漏网，AI review 指出）；或打了 chore 等内部标签。软提醒不红——判断「用户能不能
  # 感知」是人的事，CI 只负责别让人忘了。满足后自动删评论。
  # 仓库是私有 org 仓、没有 fork 贡献，pull_request 事件的 token 够写评论。
  changelog-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const MARKER = '<!-- changelog-reminder -->';
            const EXEMPT_LABELS = ['chore', 'workflow', 'research'];
            // 用户碰不到的路径：全部改动都在这里面就不用条目
            const INTERNAL_PATH = /^(content\/manual\/|docs\/|tests\/|\.github\/|db\/|scripts\/|deploy\/|README\.md$|AGENTS\.md$|CLAUDE\.md$)/;
            const pr = context.payload.pull_request;

            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const hasEntry = files.some(f =>
              /^content\/changelog\/unreleased\/[^_][^/]*\.md$/.test(f.filename) && f.status !== 'removed'
            );
            const exempt = pr.labels.some(l => EXEMPT_LABELS.includes(l.name))
              || files.every(f => INTERNAL_PATH.test(f.filename));

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(MARKER));

            if (hasEntry || exempt) {
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                });
              }
              return;
            }
            if (existing) return;

            const body = [
              MARKER,
              '## 📝 这个 PR 还没有更新日志条目',
              '',
              '用户在「更新日志」里看到的不是 commit message，是人写的一句话（#569，DEV_GUIDE §12.8）。二选一：',
              '',
              '- **用户能感知到变化**（新功能 / 改了流程或文案 / 修了他们碰得到的 bug）→ 复制 `content/changelog/_TEMPLATE.md` 到 `content/changelog/unreleased/' + pr.number + '-<两三个词>.md`，写给导演 / 舞监看得懂的一句话，`page` 指向对应手册页',
              '- **纯内部改动**（重构、依赖升级）→ 给 PR 打 `chore` 标签（或 ' + EXEMPT_LABELS.filter(l => l !== 'chore').map(l => '`' + l + '`').join(' / ') + '）。只改文档 / 测试 / CI / 迁移的 PR 自动豁免，不用打',
              '',
              '补上任一项后这条评论会自动消失。',
              '',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body,
            });

  # AI-based code review: posts findings as a PR comment (not a CI gate).
  # Triggers automatically on PR open; re-run manually via workflow_dispatch.
  ai-review:
    if: |
      (github.event_name == 'pull_request' && github.event.action == 'opened') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          script: |
            const MARKER = '<!-- ai-code-review -->';

            const prNumber = context.eventName === 'workflow_dispatch'
              ? parseInt(context.payload.inputs.pr_number, 10)
              : context.payload.pull_request.number;

            if (!process.env.ANTHROPIC_API_KEY) {
              console.log('ANTHROPIC_API_KEY not set, skipping AI review.');
              return;
            }

            // ── Fetch PR metadata ──────────────────────────────────────────────
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            });

            // ── Build diff context ─────────────────────────────────────────────
            // Focus on source files; skip lock files and large generated assets.
            const SKIP = /package-lock\.json|yarn\.lock|pnpm-lock\.yaml|\.png$|\.jpg$|\.svg$|\.ico$/;
            const PRIORITY = /^(lib\/|app\/api\/|tests\/|db\/|\.github\/)/;

            const relevant = files
              .filter(f => !SKIP.test(f.filename))
              .sort((a, b) => {
                const ap = PRIORITY.test(a.filename) ? 0 : 1;
                const bp = PRIORITY.test(b.filename) ? 0 : 1;
                return ap - bp;
              });

            // Per-file patch cap: 300 lines each, total cap 12 000 chars.
            const MAX_PATCH_LINES = 300;
            const MAX_TOTAL_CHARS = 12000;

            let diffText = '';
            let shownFiles = 0;
            let cutMidFile = false;
            for (const f of relevant) {
              if (diffText.length >= MAX_TOTAL_CHARS) break;
              const patch = f.patch ?? '(binary or no textual diff)';
              const lines = patch.split('\n');
              const truncated = lines.length > MAX_PATCH_LINES
                ? lines.slice(0, MAX_PATCH_LINES).join('\n') + `\n… (+${lines.length - MAX_PATCH_LINES} lines not shown)`
                : patch;
              const entry = `### ${f.filename}  [${f.status}  +${f.additions}/-${f.deletions}]\n${truncated}\n`;
              const remaining = MAX_TOTAL_CHARS - diffText.length;
              if (entry.length > remaining) {
                if (remaining > 0) {
                  diffText += entry.slice(0, remaining);
                  cutMidFile = true;
                  shownFiles++;
                }
                diffText += '\n… (cut here — total diff size limit reached)';
                break;
              }
              diffText += entry;
              shownFiles++;
            }

            const skippedByBinary = files.length - relevant.length;
            const skippedByLimit = relevant.length - shownFiles;
            const footerParts = [];
            if (skippedByBinary > 0) footerParts.push(`${skippedByBinary} binary/lock file(s) omitted`);
            if (cutMidFile) footerParts.push('last file shown partially');
            if (skippedByLimit > 0) footerParts.push(`${skippedByLimit} file(s) not shown — diff too large`);
            const footer = footerParts.length > 0 ? `\n_(${footerParts.join('; ')})_` : '';

            // ── Call Claude ────────────────────────────────────────────────────
            const systemPrompt = [
              'You are a senior code reviewer for a Next.js 15 + PostgreSQL production management web app.',
              'Tech stack: TypeScript, Next.js App Router, PostgreSQL via `lib/pg.ts` pool, Vitest for tests.',
              // 规约本体在 AGENTS.md（索引）与 docs/DEV_GUIDE.md；这里只列 reviewer 看 diff 就能核的硬规则，
              // 改规约时同批改这里（#616：seed-schema.json / CoW / 运行时 migration 三条退役规约残留曾误报）。
              'Key conventions (source of truth: AGENTS.md and docs/DEV_GUIDE.md; § numbers refer to DEV_GUIDE):',
              '- All DB writes use transactions (`client.query("BEGIN")` ... `COMMIT`).',
              '- Schema changes (§6): one dbmate file `db/migrations/<YYYYMMDDHHMMSS>_<name>.sql` with `-- migrate:up` / `-- migrate:down`; the SAME PR must also edit `db/schema.sql` (hand-written full snapshot) and regenerate `db/schema-fingerprint.txt` via `npm run db:check -- --update` (never hand-edited). `down` is a real reverse only for add-column / add-table / add-index; drop / rename / type change / data backfill write `DO $$ BEGIN RAISE EXCEPTION \'irreversible\'; END $$;`. Migrations already merged to main are never modified, renamed or deleted. Nothing new goes into `db/legacy/`.',
              '- Destructive or data migrations (§6.6) ship `tests/migrations/<name>.migration.test.ts` (schema / integrity / invariance layers; invariance may be omitted only for a pure DROP with no data transformation) and, for data migrations, a `tests/migrations/<name>.snapshot.ts` hook that creates data unconditionally (a data predicate is always false on the empty CI db). Never turn an invariance test into an unconditional skip / todo.',
              '- Expand / contract (§6.3): the version that stops reading or writing a column / table does not drop it; the drop lands in the next version, so N-1 code runs on the N schema.',
              '- New tables use `TEXT PRIMARY KEY` with an app-side short id, not `UUID DEFAULT gen_random_uuid()` (§13.1).',
              '- No raw DDL (`ALTER TABLE`, `CREATE INDEX`, `DROP TABLE`) in `lib/` or `app/` -- DDL belongs in `db/migrations/` only.',
              '- New query functions go in `lib/<domain>/*-db.ts`, never into `lib/db.ts` (being split, #486). Every new exported function in `lib/<domain>/*-db.ts` must have a corresponding test in `tests/` — normally `tests/<domain>/`; a few finer lib/ domains fold into a coarser tests/ domain (`lib/editor/`→`tests/wiki/`, `lib/approval/` and `lib/production/`→`tests/ops/`), see §11.2.',
              '- Every new `app/api/` route handler must have tests for 401, non-member 403 and single-key-only 403 (§11.4); tests must not pass a gate via `isAdmin: true`.',
              '- Permission gates (§5): use `hasEffectiveGrant` / `hasAnyEffectiveGrant` / `requireGrantGate` (owner bypass built in); bare `hasGrant` only with a comment saying why owner bypass is intentionally withheld. `hasPermission`, the `Permission` union, `ROLE_TEMPLATE_PERMISSIONS` and `adminBypass` are retired — flag any new use. `session.isAdmin` / `permCtx.isAdmin` are always false — flag any new gate depending on them. A key being in a role template is not a grant; never skip the check because of the template.',
              '- Only `head` exists: the version / snapshot / Copy-on-Write system is retired (§13.1). Flag new code that introduces a version dimension, snapshot refCounts, or cites "CoW" constraints.',
              '- Display name / avatar / contact info come from `LEFT JOIN user_profile`; never add a `JOIN feishu_user` for names (§8).',
              '- Client components (`"use client"`) may only import modules with zero node dependencies (`*-types.ts` / `*-score.ts`); a module touching `node:fs` or `@/lib/pg` entering the client bundle 500s the whole site including `/login`, and neither `tsc` nor vitest catches it (§13.3).',
              '- User-facing changes ship with a changelog entry in `content/changelog/unreleased/*.md` (and manual updates in `content/manual/`). Both are written for non-technical readers (directors, stage managers): flag entries that leak issue numbers, file paths, code identifiers, or describe the implementation instead of what the user will see.',
              '- GC queries must use separate statements, not CTEs (CTE snapshot isolation prevents NOT EXISTS from seeing same-transaction deletes).',
              '',
              'Review ONLY what is visible in the diff. Do not speculate about files not shown.',
              'If the diff ends with "cut here" or lists files as "not shown", that is a size limit — do not flag it as a finding.',
              'Be concise. Skip trivial style issues. Focus on correctness, safety, and convention violations.',
            ].join('\n');

            const prBody = pr.body ? pr.body.slice(0, 1000) : '(no description)';
            const userPrompt = [
              `PR #${prNumber}: ${pr.title}`,
              '',
              prBody,
              '',
              `## Changed files (${files.length} total)`,
              diffText + footer,
            ].join('\n');

            const callClaude = async () => {
              const res = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: {
                  'content-type': 'application/json',
                  'x-api-key': process.env.ANTHROPIC_API_KEY,
                  'anthropic-version': '2023-06-01',
                },
                body: JSON.stringify({
                  model: 'claude-sonnet-5',
                  // claude-sonnet-5 是推理模型，省略 thinking 时默认跑 adaptive，
                  // 而 max_tokens 是 **CoT + 正文的总预算**——不是正文预算。
                  // 原来的 5000 被思维链吃掉大半，review 正文写到一半就撞顶：
                  // #288 那次切在 "…or accept and note the deliberate t"。
                  // 这与 30037e2（蒸馏被思维链饿死）是同一个坑，那次 content 直接
                  // 空掉还报了错，这次拿到的是**非空但截断**的字符串，一路静默贴出去。
                  // 16000 是官方对非流式请求的推荐默认值。
                  max_tokens: 16000,
                  // 显式写出思考档位：让"这是个推理模型"在代码里可见，
                  // 而不是靠默认行为。review 要看全 diff，用 high。
                  output_config: { effort: 'high' },
                  system: systemPrompt,
                  messages: [{ role: 'user', content: userPrompt }],
                }),
              });
              if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
              const data = await res.json();
              const text = (data.content ?? []).find(b => b.type === 'text')?.text;
              if (!text) console.log(`Empty content. stop_reason=${data.stop_reason} content_types=${JSON.stringify((data.content ?? []).map(b => b.type))}`);
              // stop_reason 一并带回来：撞预算时正文是**非空但截断**的，光看文本
              // 分不出来"它只有这么多话说"和"它被切了"。
              return { text: text ?? null, stopReason: data.stop_reason, usage: data.usage };
            };

            let aiResponse;
            let truncated = false;
            try {
              let res = await callClaude();
              if (!res.text) {
                console.log('Retrying after empty response…');
                res = await callClaude();
              }
              aiResponse = res.text ?? '(empty response)';
              truncated = res.stopReason === 'max_tokens';
              console.log(`stop_reason=${res.stopReason} output_tokens=${res.usage?.output_tokens}`);
            } catch (err) {
              console.log(`Anthropic API request failed: ${err.message}`);
              return;
            }

            // ── Post or update comment ─────────────────────────────────────────
            const now = new Date().toISOString().slice(0, 16).replace('T', ' ') + ' UTC';
            const actionsUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/pr-automation.yml`;
            // 横幅必须在**正文之前**：这个修复的前提就是"读者会在没察觉截断的
            // 情况下读完并停下"，把提示放在（可能很长的）截断正文之后，等于重演
            // 它要解决的那个问题。#289 的 AI review 抓到了这条。
            const emptyResponse = aiResponse === '(empty response)';
            const banner =
              truncated && emptyResponse
                // 30037e2 那个形态：思维链把预算吃光，正文一个字都没写出来
                ? '> ⚠️ **模型的思维链吃光了输出预算，正文为空。** 需要提高 `max_tokens` 后用下面的链接重跑。'
                : truncated
                ? '> ⚠️ **本次 review 因输出预算截断，下面不是完整意见。** 提高 `max_tokens` 后用下面的链接重跑。'
                : null;

            const body = [
              MARKER,
              '## 🤖 AI Code Review',
              '',
              ...(banner ? [banner, ''] : []),
              aiResponse,
              '',
              `---`,
              `_claude-sonnet-5 · ${now} · 重新触发: [Actions → Run workflow](${actionsUrl}) (pr\\_number=${prNumber})_`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.includes(MARKER)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

            console.log(`AI review posted to PR #${prNumber}.`);
