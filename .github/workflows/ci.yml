name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

  unit-test:
    runs-on: ubuntu-latest
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: script_editor_test
      PGUSER: script_editor
      PGPASSWORD: testpassword

    services:
      postgres:
        # pgvector 官方镜像 = postgres:16 + vector 扩展（agent 记忆索引需要）。
        # 版本**钉死 0.6.0** 与服务器 apt 的 postgresql-16-pgvector 0.6.0 对齐
        # ——浮动 tag（:pg16）会跟最新版走，0.7+ 特性（halfvec/迭代扫描等）
        # 混进 SQL 时 CI 照样绿、上线才炸（review #297 finding 1）。
        # 服务器升级 pgvector 时同步改这里。
        image: pgvector/pgvector:0.6.0-pg16
        env:
          POSTGRES_USER: script_editor
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: script_editor_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4.2.2

      # Fetch the base branch tip so we can detect new migration files and
      # restore the pre-migration schema for the migration test path.
      - name: Fetch base branch
        run: git fetch --depth=1 origin $GITHUB_BASE_REF

      # Detect db/add-*.sql or db/migrate-*.sql files that are NEW in this PR
      # (not yet on the base branch). These are static migrations that will be
      # applied to existing production data at deploy time.
      - name: Detect DDL migration files in this PR
        id: migrations
        run: |
          FILES=$(git diff origin/$GITHUB_BASE_REF HEAD --name-only --diff-filter=A -- 'db/add-*.sql' 'db/migrate-*.sql')
          if [ -n "$FILES" ]; then
            echo "has_migrations=true" >> $GITHUB_OUTPUT
            printf 'files<<EOF\n%s\nEOF\n' "$FILES" >> $GITHUB_OUTPUT
            echo "Migration files detected:"
            echo "$FILES"
          else
            echo "has_migrations=false" >> $GITHUB_OUTPUT
            echo "No new migration files in this PR."
          fi

      # ── Schema application (two paths) ──────────────────────────────────────
      #
      # MIGRATION PATH: Apply the base-branch schema so we can test that the
      # migration files work correctly on real pre-migration data.
      - name: Apply base schema (migration path)
        if: steps.migrations.outputs.has_migrations == 'true'
        run: git show origin/$GITHUB_BASE_REF:db/schema.sql | psql -v ON_ERROR_STOP=1

      # NORMAL PATH: Fresh install from the current schema (no new migrations).
      - name: Apply current schema (normal path)
        if: steps.migrations.outputs.has_migrations != 'true'
        run: psql -v ON_ERROR_STOP=1 -f db/schema.sql

      # Additive DDL migrations are safe to apply directly after the base
      # schema. Data migrations remain the responsibility of the test harness
      # so it can capture and verify pre-migration data first.
      - name: Apply additive DDL migrations
        if: steps.migrations.outputs.has_migrations == 'true'
        env:
          MIGRATION_FILES: ${{ steps.migrations.outputs.files }}
        run: |
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              db/add-*.sql)
                echo "Applying $file"
                psql -v ON_ERROR_STOP=1 -f "$file"
                ;;
            esac
          done <<< "$MIGRATION_FILES"

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write test .env.local
        run: |
          cat > .env.local <<'EOF'
          PGHOST=localhost
          PGPORT=5432
          PGDATABASE=script_editor_test
          PGUSER=script_editor
          PGPASSWORD=testpassword
          EOF

      # MIGRATION PATH: global-setup.ts detects the old schema, inserts factory
      # data for invariance testing, captures a snapshot, then applies the
      # data migration — so invariance tests have real data to verify against.

      # ── Unit tests ────────────────────────────────────────────────────────────
      - name: Run unit tests
        run: npm test

  # ── 跨平台分页一致性（#336 B3）─────────────────────────────────────────────
  # golden.json 在 Mac 上生成，这里在 Linux 的无头 Chromium 里比对：字体自托管
  # 的目的就是「同一份剧本在不同平台页码相同」，这一步守的是结果而不是配置。
  # 只在打印 / 分页 / 字体相关文件改动时跑——起 dev server + 装 Chromium 要几分钟。
  print-consistency:
    runs-on: ubuntu-latest
    # 起 dev server + 装 Chromium + 首次编译打印路由，正常 6–8 分钟；卡住就杀
    timeout-minutes: 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: script_editor_test
      PGUSER: script_editor
      PGPASSWORD: testpassword

    services:
      postgres:
        image: pgvector/pgvector:0.6.0-pg16
        env:
          POSTGRES_USER: script_editor
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: script_editor_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4.2.2

      # 本 workflow 只在 pull_request 上触发（见文件头 on:），GITHUB_BASE_REF 恒有值；
      # 防御：没有 base（将来加了 push 触发）就直接跑，别让 git fetch "" 报错。
      - name: Decide whether print-affecting files changed
        id: relevant
        run: |
          if [ -z "$GITHUB_BASE_REF" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
            echo "No base ref (not a pull_request); running unconditionally."
            exit 0
          fi
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          CHANGED=$(git diff origin/$GITHUB_BASE_REF HEAD --name-only -- \
            'public/fonts/**' 'app/fonts.css' 'app/globals.css' \
            'components/print/**' 'lib/script-page.ts' 'lib/print-css.ts' \
            'lib/script-block-layout.ts' 'lib/script-md.ts' \
            'scripts/print-consistency/**' 'scripts/fonts/**' '.github/workflows/ci.yml')
          if [ -n "$CHANGED" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
            echo "Print-affecting changes:"; echo "$CHANGED"
          else
            echo "run=false" >> $GITHUB_OUTPUT
            echo "No print-affecting changes; skipping."
          fi

      - name: Apply schema
        if: steps.relevant.outputs.run == 'true'
        run: psql -v ON_ERROR_STOP=1 -f db/schema.sql

      - uses: actions/setup-node@v4.4.0
        if: steps.relevant.outputs.run == 'true'
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.relevant.outputs.run == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.relevant.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Write test .env.local
        if: steps.relevant.outputs.run == 'true'
        run: |
          cat > .env.local <<'EOF'
          PGHOST=localhost
          PGPORT=5432
          PGDATABASE=script_editor_test
          PGUSER=script_editor
          PGPASSWORD=testpassword
          EOF

      - name: Start dev server
        if: steps.relevant.outputs.run == 'true'
        run: |
          npx next dev -p 3100 > next-dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3100/login > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3100/login > /dev/null || { cat next-dev.log; exit 1; }

      - name: Compare pagination against golden
        if: steps.relevant.outputs.run == 'true'
        env:
          BASE_URL: http://localhost:3100
        run: npx tsx scripts/print-consistency/check.ts

      - name: Dump dev server log on failure
        if: failure() && steps.relevant.outputs.run == 'true'
        run: tail -100 next-dev.log

      - name: Stop dev server
        if: always() && steps.relevant.outputs.run == 'true'
        run: pkill -f "next dev" || true

