name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

  unit-test:
    runs-on: ubuntu-latest
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: script_editor_test
      PGUSER: script_editor
      PGPASSWORD: testpassword

    services:
      postgres:
        # pgvector 官方镜像 = postgres:16 + vector 扩展（agent 记忆索引需要）。
        # 版本**钉死 0.6.0** 与服务器 apt 的 postgresql-16-pgvector 0.6.0 对齐
        # ——浮动 tag（:pg16）会跟最新版走，0.7+ 特性（halfvec/迭代扫描等）
        # 混进 SQL 时 CI 照样绿、上线才炸（review #297 finding 1）。
        # 服务器升级 pgvector 时同步改这里。
        image: pgvector/pgvector:0.6.0-pg16
        env:
          POSTGRES_USER: script_editor
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: script_editor_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Schema（#561）────────────────────────────────────────────────────────
      # 两条路径，都用 dbmate；global-setup.ts 不再逐支硬编码。
      #
      # MIGRATION PATH（PR 新增了 db/migrations/*.sql）：库先按 base 分支的
      # migrations 建到「旧结构」，global-setup 发现 PR 的 migration 还没应用 →
      # 对每支找同名 tests/migrations/<name>.snapshot.ts 造迁移前数据并快照 →
      # dbmate up → invariance 测试拿快照比对。
      #
      # NORMAL PATH：空库 dbmate up 到最新（只有 baseline + 已合并的几支，秒级）。
      - name: Fetch base branch
        run: git fetch --depth=1 origin $GITHUB_BASE_REF

      - name: Detect migrations in this PR
        id: migrations
        run: |
          NEW=$(git diff origin/$GITHUB_BASE_REF HEAD --name-only --diff-filter=A -- 'db/migrations/*.sql')
          # base 分支还没有 db/migrations（只有 dbmate 接管那个 PR 会遇到）：没有「旧结构」
          # 可建，按 normal path 走。
          if [ -z "$(git ls-tree -d origin/$GITHUB_BASE_REF db/migrations)" ]; then
            echo "Base branch has no db/migrations yet — normal path."
            NEW=""
          fi
          if [ -n "$NEW" ]; then
            echo "has_migrations=true" >> $GITHUB_OUTPUT
            echo "New migrations:"; echo "$NEW"
          else
            echo "has_migrations=false" >> $GITHUB_OUTPUT
            echo "No new migrations in this PR."
          fi

      # 已合并的 migration 文件一经上 main 不得改动（dbmate 只按文件名记账，改内容
      # 不会重跑，改动会静默丢失；也是 dbmate 没有 checksum 的补位）。改名 / 删除同禁。
      - name: Forbid touching merged migrations
        run: |
          TOUCHED=$(git diff origin/$GITHUB_BASE_REF HEAD --name-only --diff-filter=MDR -- 'db/migrations/*.sql')
          if [ -n "$TOUCHED" ]; then
            echo "::error::已合并的 migration 文件不得修改 / 改名 / 删除（新开一支 migration 修正）："
            echo "$TOUCHED"
            exit 1
          fi

      - name: Apply base-branch migrations (migration path)
        if: steps.migrations.outputs.has_migrations == 'true'
        run: |
          rm -rf /tmp/base-migrations && mkdir -p /tmp/base-migrations
          git archive origin/$GITHUB_BASE_REF db/migrations | tar -x -C /tmp/base-migrations
          npx dbmate --url "postgres://script_editor:testpassword@localhost:5432/script_editor_test?sslmode=disable" \
            --migrations-dir /tmp/base-migrations/db/migrations --no-dump-schema up

      - name: Apply all migrations (normal path)
        if: steps.migrations.outputs.has_migrations != 'true'
        run: npm run db -- up

      # 三方一致：空库跑 migrations == 空库跑 db/schema.sql == db/schema-fingerprint.txt。
      # 忘了把新 migration 的 DDL 同步进 schema.sql、或忘了重生成指纹，都在这里红。
      - name: Schema consistency check
        run: npm run db:check

      - name: Write test .env.local
        run: |
          cat > .env.local <<'EOF'
          PGHOST=localhost
          PGPORT=5432
          PGDATABASE=script_editor_test
          PGUSER=script_editor
          PGPASSWORD=testpassword
          EOF

      # ── Unit tests ────────────────────────────────────────────────────────────
      - name: Run unit tests
        run: npm test

  # ── 跨平台分页一致性（#336 B3）─────────────────────────────────────────────
  # golden.json 在 Mac 上生成，这里在 Linux 的无头 Chromium 里比对：字体自托管
  # 的目的就是「同一份剧本在不同平台页码相同」，这一步守的是结果而不是配置。
  # 只在打印 / 分页 / 字体相关文件改动时跑——起 dev server + 装 Chromium 要几分钟。
  print-consistency:
    runs-on: ubuntu-latest
    # 起 dev server + 装 Chromium + 首次编译打印路由，正常 6–8 分钟；卡住就杀
    timeout-minutes: 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: script_editor_test
      PGUSER: script_editor
      PGPASSWORD: testpassword

    services:
      postgres:
        image: pgvector/pgvector:0.6.0-pg16
        env:
          POSTGRES_USER: script_editor
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: script_editor_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4.2.2

      # 本 workflow 只在 pull_request 上触发（见文件头 on:），GITHUB_BASE_REF 恒有值；
      # 防御：没有 base（将来加了 push 触发）就直接跑，别让 git fetch "" 报错。
      - name: Decide whether print-affecting files changed
        id: relevant
        run: |
          if [ -z "$GITHUB_BASE_REF" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
            echo "No base ref (not a pull_request); running unconditionally."
            exit 0
          fi
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          CHANGED=$(git diff origin/$GITHUB_BASE_REF HEAD --name-only -- \
            'public/fonts/**' 'app/fonts.css' 'app/globals.css' \
            'components/print/**' 'lib/script/script-page.ts' 'lib/script/print-css.ts' \
            'lib/script/script-block-layout.ts' 'lib/script/script-md.ts' \
            'scripts/print-consistency/**' 'scripts/fonts/**' '.github/workflows/ci.yml')
          if [ -n "$CHANGED" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
            echo "Print-affecting changes:"; echo "$CHANGED"
          else
            echo "run=false" >> $GITHUB_OUTPUT
            echo "No print-affecting changes; skipping."
          fi

      - name: Apply schema
        if: steps.relevant.outputs.run == 'true'
        run: psql -v ON_ERROR_STOP=1 -f db/schema.sql

      - uses: actions/setup-node@v4.4.0
        if: steps.relevant.outputs.run == 'true'
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.relevant.outputs.run == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.relevant.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Write test .env.local
        if: steps.relevant.outputs.run == 'true'
        run: |
          cat > .env.local <<'EOF'
          PGHOST=localhost
          PGPORT=5432
          PGDATABASE=script_editor_test
          PGUSER=script_editor
          PGPASSWORD=testpassword
          EOF

      - name: Start dev server
        if: steps.relevant.outputs.run == 'true'
        run: |
          npx next dev -p 3100 > next-dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3100/login > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3100/login > /dev/null || { cat next-dev.log; exit 1; }

      - name: Compare pagination against golden (center)
        if: steps.relevant.outputs.run == 'true'
        env:
          BASE_URL: http://localhost:3100
        run: npx tsx scripts/print-consistency/check.ts

      # 第二份 golden：左栏角色名（compact）。两种排版模式的渲染路径不同，只守一种
      # 会漏掉另一种的回归（模版引擎接入时就靠它抓出了侧栏行折叠的错）。
      - name: Compare pagination against golden (compact)
        if: steps.relevant.outputs.run == 'true'
        env:
          BASE_URL: http://localhost:3100
          FIXTURE_TEXT_LAYOUT: compact
          GOLDEN_PATH: scripts/print-consistency/golden-compact.json
        run: npx tsx scripts/print-consistency/check.ts

      # 第三份 golden：百老汇音乐剧模版——第一个非 legacy 模版，守它就是守引擎的新原语
      # （行内流 / 缩进 / 每场另起页 / 页眉幕–场–页）在 Linux 上与 Mac 一致。
      - name: Compare pagination against golden (broadway)
        if: steps.relevant.outputs.run == 'true'
        env:
          BASE_URL: http://localhost:3100
          FIXTURE_TEMPLATE_ID: broadway-musical@1
          GOLDEN_PATH: scripts/print-consistency/golden-broadway.json
        run: npx tsx scripts/print-consistency/check.ts

      - name: Dump dev server log on failure
        if: failure() && steps.relevant.outputs.run == 'true'
        run: tail -100 next-dev.log

      - name: Stop dev server
        if: always() && steps.relevant.outputs.run == 'true'
        run: pkill -f "next dev" || true

